# Local development database.
#
# Production and staging run on Neon PostgreSQL (SRS 2.3, 19.1). Neon is plain
# PostgreSQL, so the schema, migrations and queries are identical here; this file
# only removes the need for network access and a Neon branch during development.
services:
  postgres:
    image: postgres:17-alpine
    container_name: bribar-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: bribar
      POSTGRES_PASSWORD: bribar_local_dev
      POSTGRES_DB: bribar
      # Deterministic collation so ORDER BY matches Neon.
      POSTGRES_INITDB_ARGS: '--locale=C --encoding=UTF8'
    ports:
      - '5434:5432'
    volumes:
      - bribar-pgdata:/var/lib/postgresql/data
      # Runs once, on first initialisation of the volume, to create the
      # separate database the integration suite uses.
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U bribar -d bribar']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bribar-pgdata:
